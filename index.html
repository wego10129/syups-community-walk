<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>三玉社區踏查地圖</title>
<style>
  /* 外框風格照 class-games：深色粗框、硬陰影、方格紙底 */
  :root {
    --ink: #3b2f2a;
    --line: #1B2836;
    --paper: #fffaf0;
    --accent: #e8704a;
    --sun: #FACC15;
    font-size: 18px;
  }
  @media (min-width: 1400px) { :root { font-size: 22px; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe9ff; color: var(--ink);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pop { background: var(--paper); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); }

  /* 注音：照 class-games，用注音字型（國字和注音是同一個字形，js/bpmf-font.js） */
  .zyt { font-family: 'CW Bpmf', 'PingFang TC', serif; font-weight: 400; letter-spacing: .02em; }

  /* 上方：標題、地點、設定 */
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + .5rem) .8rem .5rem;
    display: flex; align-items: center; gap: .6rem; pointer-events: none; flex-wrap: wrap; }
  #title { border-radius: 14px; padding: .3rem .9rem; pointer-events: auto; }
  #title b { font-size: 1.3rem; display: block; line-height: 1.5; }
  #title small { opacity: .7; font-size: .75rem; }
  #stamps { display: flex; gap: .3rem; border-radius: 14px; padding: .3rem .45rem; pointer-events: auto; flex-wrap: wrap; }
  .stamp { width: 2.3rem; height: 2.3rem; border-radius: 50%; border: 2px dashed #c9b9a6; padding: .25rem;
    filter: grayscale(1); opacity: .45; transition: all .25s; }
  .stamp.done { border: 2px solid var(--accent); background: #fff0e6; filter: none; opacity: 1; }
  .stamp.here { outline: 3px solid var(--accent); outline-offset: 2px; filter: none; opacity: 1; }
  .stamp:active { transform: scale(.9); }
  #menuBtn { margin-left: auto; pointer-events: auto; }
  .round { width: 2.9rem; height: 2.9rem; border-radius: 50%; font-size: 1.3rem; }
  .round.on { background: var(--sun); }
  .round { padding: .45rem; }
  .ic { display: inline-block; width: 1.2em; height: 1.2em; vertical-align: -.2em; margin-right: .25em; }
  .round .ic { width: 100%; height: 100%; margin: 0; }

  /* 設定選單 */
  #menu { position: fixed; top: 4.6rem; right: .8rem; border-radius: 16px; padding: .5rem; display: none; z-index: 15; width: 18rem; }
  #menu.show { display: block; }
  #menu button { display: block; width: 100%; text-align: left; padding: .65rem .7rem; border-radius: 10px; font-size: 1rem; }
  #menu button:hover { background: #f4ead9; }
  #menu hr { border: none; border-top: 2px dashed #eadfce; margin: .3rem 0; }

  /* 下方：主要按鈕 */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: .8rem .8rem calc(env(safe-area-inset-bottom) + 1rem);
    display: flex; justify-content: center; align-items: center; gap: .7rem; pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  #goBtn { background: var(--accent); color: #fff; font-size: 1.4rem; padding: .7rem 1.8rem; border-radius: 2rem;
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--line); min-width: 14rem; }
  #goBtn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }
  #goBtn:disabled { background: #b9aa9a; }
  body.carded #bottom { display: none; }

  /* 地點卡：橫式在右邊、直式在下面，3D 建築露在旁邊對照 */
  #card { position: fixed; top: 0; right: 0; bottom: 0; width: min(46vw, 560px); padding: 4.6rem .8rem .8rem 0; display: none; z-index: 10; pointer-events: none; }
  #card.show { display: flex; }
  #sheet { pointer-events: auto; flex: 1; display: flex; flex-direction: column; gap: .6rem; overflow-y: auto; border-radius: 22px; padding: .8rem 1rem 1rem;
    background: #F7F4EC linear-gradient(rgba(27,40,54,.05) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, rgba(27,40,54,.05) 1px, transparent 1px) 0 0 / 22px 22px;
    border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--line); animation: slide .3s ease-out; }
  @keyframes slide { from { transform: translateX(30px); opacity: .3; } }
  @media (orientation: portrait) {
    #card { top: auto; left: 0; width: auto; height: 56vh; padding: 0 .6rem .6rem; }
    .bigPhoto { aspect-ratio: 16 / 9; }
  }
  .head { display: flex; align-items: center; gap: .6rem; }
  .head .hi { width: 2.6rem; height: 2.6rem; flex: none; }
  .head h2 { margin: 0; font-size: 1.7rem; font-weight: 400; }
  .x { margin-left: auto; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: #fff; border: 3px solid var(--line); box-shadow: 2px 2px 0 var(--line); font-size: 1.1rem; flex: none; }
  .photos { flex: none; }
  .bigPhoto { width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; border: 3px solid var(--line); background: #ddd center / cover no-repeat; }
  .thumbs { display: flex; gap: .5rem; margin-top: .5rem; }
  .th { position: relative; width: 4.2rem; height: 3.2rem; border-radius: 10px; border: 3px solid #c9b9a6; background: #fff center / cover no-repeat; font-size: 1.6rem; color: #a99886; }
  .th.on { border-color: var(--accent); }
  .th .rm { position: absolute; top: -.55rem; right: -.55rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: #fff; border: 2px solid var(--line); font-size: .7rem; line-height: 1.2rem; color: var(--ink); }
  .emptyPhoto { width: 100%; height: 7.5rem; border-radius: 16px; border: 3px dashed #b6ab9c; background: rgba(255,255,255,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; font-size: 1.4rem; }
  .emptyPhoto .ei { width: 2.6rem; height: 2.6rem; }
  .emptyPhoto .ei .ic { width: 100%; height: 100%; margin: 0; }
  .emptyPhoto small { font-size: .85rem; opacity: .7; }
  .block { display: block; width: 100%; text-align: left; background: #fff; border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); border-radius: 14px; padding: .5rem .8rem; font-size: 1.35rem; line-height: 1.7; }
  .block .lb { font-size: 1rem; font-weight: bold; color: #7a6656; line-height: 1.6; }
  .block .lb small { font-weight: normal; margin-left: .3rem; }
  .block.look { background: #FEF9C3; }
  .block.talk { background: #E0F2FE; }
  .block.learn .ans { display: none; }
  .block.learn.open { background: #DCFCE7; }
  .block.learn.open .ans { display: block; }
  .block.learn.open small { display: none; }
  .rules ol { margin: .1rem 0 0; padding-left: 1.5em; font-size: 1.2rem; }
  .foot { display: flex; gap: .6rem; margin-top: auto; padding-top: .3rem; flex-wrap: wrap; }
  .btn { flex: 1; background: var(--sun); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--line); border-radius: 14px; padding: .55rem .9rem; font-size: 1.2rem; white-space: nowrap; }
  .btn.gray { background: #fff; flex: none; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
  .btn:disabled { opacity: .6; }

  /* 家長分享圖 */
  #share { position: fixed; inset: 0; background: rgba(27, 40, 54, .45); display: none; align-items: center; justify-content: center; z-index: 30; padding: 1rem; }
  #share.show { display: flex; }
  #shareBox { width: min(40rem, 100%); max-height: 94vh; overflow-y: auto; border-radius: 22px; padding: 1rem 1.2rem; }
  #shareBox { position: relative; }
  #shareBox .x { position: absolute; top: .7rem; right: .7rem; }
  #shareBox h3 { margin: .3rem 0 .4rem; font-size: 1.4rem; }
  .note { font-size: 1rem; line-height: 1.6; margin: .3rem 0; }
  .check { display: flex; gap: .5rem; align-items: flex-start; background: #FEF9C3; border-radius: 12px; padding: .5rem .7rem; margin: .6rem 0; font-size: 1rem; line-height: 1.5; }
  .check input { width: 1.3rem; height: 1.3rem; flex: none; margin-top: .1rem; }
  .row { display: flex; gap: .6rem; }
  .out { margin-top: .8rem; display: flex; flex-direction: column; gap: .6rem; }
  .out img { width: 100%; border-radius: 12px; border: 3px solid var(--line); }

  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
    background: var(--paper); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--line); border-radius: 1.4rem; padding: 1rem 1.6rem; text-align: center;
    font-size: 1.3rem; transition: all .3s; z-index: 40; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast .big { width: 4rem; height: 4rem; margin: 0 auto .3rem; display: block; }
  #bug { position: fixed; left: .6rem; bottom: .6rem; max-width: 70vw; display: none; background: #fff; border: 3px solid #d33; color: #b00; padding: .4rem .7rem; border-radius: 10px; font-size: .9rem; z-index: 60; }
  #err { position: fixed; inset: 0; display: none; place-items: center; background: var(--paper); padding: 2rem; text-align: center; z-index: 50; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="top">
  <div id="title" class="pop"><b id="titleText">社區踏查</b><small id="subText"></small></div>
  <div id="stamps" class="pop"></div>
  <button class="round pop" id="menuBtn" aria-label="設定"></button>
</div>

<div id="menu" class="pop">
  <button id="shareMenuBtn">做家長分享圖</button>
  <button id="zyBtn">注音</button>
  <hr>
  <button id="backupBtn">打包下載照片（換電腦時用）</button>
  <button id="restoreBtn">匯入照片</button>
  <hr>
  <button id="resetBtn">從頭開始（清除走過的紀錄，要按兩下）</button>
</div>

<div id="bottom">
  <button class="round pop" id="viewBtn" aria-label="看全圖"></button>
  <button id="goBtn">▶ 出發</button>
</div>

<div id="card"><div id="sheet"></div></div>
<div id="share"><div id="shareBox" class="pop"></div></div>
<div id="toast"></div>
<div id="err">這台裝置無法顯示 3D 畫面（WebGL）。<br>請改用較新的瀏覽器開啟。</div>

<div id="bug"></div>
<script>
  // 手冊：不能白畫面。程式出錯或 3 秒內沒跑完，左下角用紅框寫出原因（舊 iPad 難查的問題靠這個）
  window.__ok = false;
  window.onerror = function (m, f, l) { var b = document.getElementById("bug"); b.style.display = "block"; b.textContent = "畫面出錯了，請截圖給資訊組：" + m + "（" + String(f).split("/").pop() + " 第 " + l + " 行）"; };
  setTimeout(function () { if (!window.__ok && !document.getElementById("bug").textContent) window.onerror("程式沒有跑完，可能是瀏覽器太舊或網路擋住了檔案", "", 0); }, 3000);
</script>
<script src="vendor/three.min.js"></script>
<script src="data/tour.js"></script>
<script src="js/zhuyin.js"></script>
<script src="js/bpmf-font.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
